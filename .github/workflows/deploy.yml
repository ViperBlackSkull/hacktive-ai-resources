name: Build and Deploy

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.branch.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Get branch info
        id: branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=stable" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.branch.outputs.tag }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy-staging:
    needs: build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh -i /home/viper/.ssh/runner_deploy -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << 'EOF'
            cd /opt/hacktive-staging
            git fetch origin && git reset --hard origin/main
            sed -i "s/AI_RESOURCES_TAG=.*/AI_RESOURCES_TAG=${IMAGE_TAG}/" .env
            docker compose -f docker-compose.staging.yml pull hacktive-ai
            docker compose -f docker-compose.staging.yml up -d hacktive-ai
            docker image prune -f
          EOF

  deploy-production:
    needs: build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh -i /home/viper/.ssh/runner_deploy -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }} << 'EOF'
            cd /opt/hacktive-production
            git fetch origin && git reset --hard origin/main
            sed -i "s/AI_RESOURCES_TAG=.*/AI_RESOURCES_TAG=${IMAGE_TAG}/" .env
            docker compose -f docker-compose.production.yml pull hacktive-ai
            docker compose -f docker-compose.production.yml up -d hacktive-ai
            docker image prune -f
          EOF
