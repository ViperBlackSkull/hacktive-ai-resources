name: Build and Deploy

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      branch: ${{ steps.branch.outputs.name }}
      environment: ${{ steps.branch.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment and tag
        id: branch
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT
          if [ "$BRANCH" = "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.production.yml" >> $GITHUB_OUTPUT
            echo "deploy_path=/opt/hacktive-production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "tag=staging" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.staging.yml" >> $GITHUB_OUTPUT
            echo "deploy_path=/opt/hacktive-staging" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/viperblackskull/hacktive-ai-resources
          tags: |
            type=raw,value=${{ steps.branch.outputs.tag }}
            type=sha,prefix=${{ steps.branch.outputs.tag }}-

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            DEPLOY_PATH="${{ needs.build.outputs.environment == 'production' && '/opt/hacktive-production' || '/opt/hacktive-staging' }}"
            COMPOSE_FILE="${{ needs.build.outputs.environment == 'production' && 'docker-compose.production.yml' || 'docker-compose.staging.yml' }}"
            SERVICE_NAME="hacktive-ai"
            IMAGE_TAG="${{ needs.build.outputs.tag }}"

            echo "🚀 Deploying $SERVICE_NAME to ${{ needs.build.outputs.environment }}"
            echo "📁 Path: $DEPLOY_PATH"
            echo "🐳 Image tag: $IMAGE_TAG"

            cd "$DEPLOY_PATH" || exit 1

            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull "ghcr.io/viperblackskull/hacktive-ai-resources:$IMAGE_TAG" || echo "Image pull had issues, continuing..."

            if [ -f .env ]; then
              sed -i "s/AI_RESOURCES_TAG=.*/AI_RESOURCES_TAG=$IMAGE_TAG/" .env || true
            fi

            docker compose -f "$COMPOSE_FILE" up -d "$SERVICE_NAME"
            docker image prune -f

            echo "✅ Deployment complete!"
            docker compose -f "$COMPOSE_FILE" ps "$SERVICE_NAME"
